<!DOCTYPE html>
<html>

  <head>
    <meta charset="utf-8" />
    <title>MOKEPON!</title>
    <script src="./js/mokepon.js"></script>
    <link rel="stylesheet" href="./css/mokepon.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Goldman:wght@400;700&display=swap" rel="stylesheet">
  </head>
  
  <body>
    <div class="game-heading">
      <h1 class="title">MOKEPON!</h1>
      <div class="elements">
        <div class="fire">🔥</div>
        <div class="water">💧</div>
        <div class="earth">🌱</div>
      </div>
    </div>

    <section class="pet-section" id="seleccionar-mascota">
      <h2 class="pet-title">Elige tu mascota:</h2>

        <div class="pets-section">
          <div class="pet-type">
            <div class="pet-icon">🦛</div>
              <div class="pet-description">
                <input type="radio" name="mascota" id="hipodoge"/>
                <label for="hipodoge">Hipodoge</label>
              </div>
          </div>

          <div class="pet-type">
            <div class="pet-icon">🫏</div>
            <div class="pet-description">
              <input type="radio" name="mascota" id="capipepo"/>
              <label for="capipepo">Capipepo</label>
            </div>
          </div>
        
          <div class="pet-type">
            <div class="pet-icon">🐀</div>
            <div class="pet-description">
              <input type="radio" name="mascota" id="ratigueya"/>
              <label for="ratigueya">Ratigueya</label>
            </div>
          </div>
        </div>

        <button class="main-button" id="boton-mascota">Seleccionar ➡️</button>
    </section>

    <section class="attack-section" id="seleccionar-ataque">
      <h2 class="pet-title">Elige tu ataque:</h2>

      <div class="pet-info">
          <div class="pet-player-info">
            <p>Tu mascota es:
            <span id="mascota-jugador"></span>
            <span class="vidas-jugador"> 3</span> vidas</p>
          </div>

        <div class="pet-enemy-info">
          <p>El contrincante es <span id="mascota-enemigo"></span><span class="vidas-enemigo"> 3</span> vidas</p>
        </div>
      </div>

      <div class="buttons-group" id="ataques-jugador">
        <button class="attack-button fire" id="boton-fuego">
          <span class="attack-icon">🔥</span>
          <span>Fuego</span>
        </button>
        
        <button class="attack-button water" id="boton-agua">
          <span class="attack-icon">💧</span>
          <span>Agua</span>
        </button>
        
        <button class="attack-button earth" id="boton-tierra">
          <span class="attack-icon">🌱</span>
          <span>Tierra</span>
        </button>
      </div>

      <div class="score-section" id="mensajes">
        <section id="reiniciar">
          <button id="boton-reiniciar">Reiniciar</button>
        </section>
        <p class="message" id="result">Suerte compañero</p>
      </div>

      <div class="attack-container">
        <div id="player-attack"></div>
        <div id="enemy-attack"></div>
      </div>

  </body>
</html>

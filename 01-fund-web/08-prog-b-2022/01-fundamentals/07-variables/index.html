<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Declaración y Uso Básico de Variables en JavaScript</title>
  <script>
    // Declaración de variables
    let nombre = "David"; // Variable de tipo string
    nombre = prompt("¿Cuál es tu nombre?"); // Asigna el valor ingresado a la variable 'nombre'
    alert("Hola, " + nombre + "! Bienvenido a la programación en JavaScript."); // Muestra un mensaje de bienvenida usando la variable 'nombre'
  </script>
</head>

<body>
  <h1>Primer intento de website</h1>
  <p>Este es nuestro primer programa completo y profesional</p>
  <p>gran programas</p>
</body>
</html>
